<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f8a70">
<title>대만 중국어 연습</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#eef2f1;--surface:#fff;--ink:#15302f;--muted:#5d7472;--line:#cfdcda;--jade:#1f8a70}
@media (prefers-color-scheme:dark){:root{--bg:#0f1918;--surface:#172423;--ink:#e3eeec;--muted:#93aba8;--line:#2a3b39;--jade:#4cc3a0;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,"Noto Sans KR",sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:22px}p{margin:0;color:var(--muted)}
a.tool{display:block;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none}
a.tool b{display:block;font-size:17px}a.tool:hover{border-color:var(--jade)}
</style>
</head>
<body>
<main>
  <h1>대만 중국어 연습</h1>
  <p>2027년 2월 대만 여행 준비용 도구 모음이에요.</p>
  <a class="tool" href="tone/"><b>성조 거울</b>말하면 음높이를 그려서 1~4성을 대략 판정해 줘요.</a>
</main>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</body>
</html>
