name: Fetch scene map and photos

# Downloads OpenStreetMap data (ODbL) and Wikimedia Commons photos (per-file
# licenses) for the sign-reading scene on a runner, because the dev container
# can't reach these hosts. Results go to branch scene-geo-scratch.
on:
  push:
    branches: [scene-geo-fetch]
  workflow_dispatch:
    inputs:
      cats:
        description: "Commons categories separated by | (empty = defaults)"
        default: ""
      skip_osm:
        description: "1 to skip the OpenStreetMap download"
        default: "0"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          CATS: ${{ inputs.cats }}
          SKIP_OSM: ${{ inputs.skip_osm }}
        run: mkdir -p /tmp/d && python3 tools/fetch_scene_geo.py /tmp/d
      - name: Push to scratch branch
        run: |
          cd /tmp/d && git init -q -b scene-geo-scratch
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm scratch
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" scene-geo-scratch
